# Approved deployment template; certificate-enabled deployed config is in evidence/public-nginx-deployed.conf.
# Include inside nginx's http context (for example sites-enabled/claimguard).
limit_req_zone $binary_remote_addr zone=claims_api:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=claims_stream:10m rate=1r/m;
limit_conn_zone $binary_remote_addr zone=claims_connections:10m;
map $http_upgrade $claims_upgrade { default upgrade; '' close; }
map $http_origin $claims_cors {
    default '';
    'https://claimguard-dun.vercel.app' $http_origin;
}
map $http_origin $claims_origin_allowed {
    default 0;
    '' 1;
    'https://claimguard-dun.vercel.app' 1;
}
server {
    listen 80;
    server_name claimguard-148-100-98-100.sslip.io;
    # Obtain a valid certificate with certbot --nginx before publishing.
    client_max_body_size 16k;
    limit_conn claims_connections 8;
    if ($claims_origin_allowed = 0) { return 403; }
    add_header Access-Control-Allow-Origin $claims_cors always;
    add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Content-Type' always;
    add_header Vary Origin always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/claims {
        limit_req zone=claims_api burst=10 nodelay;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/api/claims/[A-Za-z0-9_-]+/action$ {
        limit_req zone=claims_api burst=5 nodelay;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/stream/start {
        limit_req zone=claims_stream burst=1 nodelay;
        limit_except POST { deny all; }
        # Fixed batch size/pacing; discard caller-supplied query parameters.
        proxy_pass http://127.0.0.1:8000/api/stream/start?count=100&delay=1.0;
    }
    location = /ws/claims {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $claims_upgrade;
        proxy_read_timeout 3600s;
        proxy_pass http://127.0.0.1:8000;
    }
    location / { return 404; }
}
